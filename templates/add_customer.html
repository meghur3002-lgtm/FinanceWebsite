<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Customer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-page">

    <div class="form-card">

        <div class="form-header">
            <h1>Add Customer</h1>

            <p>
                Enter the customer's payment details
            </p>
        </div>


        <form method="POST" action="/add-customer">


            <!-- Customer Name -->

            <div class="form-group">

                <label for="name">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter customer name"
                    required>

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number">

            </div>


            <!-- Amount Taken -->

            <div class="form-group">

                <label for="amount_taken">
                    Amount Taken
                </label>

                <div class="input-with-symbol">
                    <span>₹</span>

                    <input
                        type="number"
                        id="amount_taken"
                        name="amount_taken"
                        placeholder="Enter amount"
                        step="0.01"
                        min="0"
                        required>
                </div>

            </div>


            <!-- Starting Date -->

            <div class="form-group">

                <label for="start_date">
                    Starting Date
                </label>

                <input
                    type="date"
                    id="start_date"
                    name="start_date"
                    required>

            </div>


            <!-- Payment Type -->

            <div class="form-group">

                <label for="payment_type">
                    Payment Type
                </label>

                <select
                    id="payment_type"
                    name="payment_type"
                    required>

                    <option value="">
                        Select payment type
                    </option>

                    <option value="Weekly">
                        Weekly
                    </option>

                    <option value="Monthly">
                        Monthly
                    </option>

                </select>

            </div>


            <!-- Payment Amount -->

            <div class="form-group">

                <label for="payment_amount">
                    Payment Amount
                </label>

                <div class="input-with-symbol">
                    <span>₹</span>

                    <input
                        type="number"
                        id="payment_amount"
                        name="payment_amount"
                        placeholder="Enter weekly/monthly payment"
                        step="0.01"
                        min="0"
                        required>
                </div>

            </div>


            <!-- Buttons -->

            <div class="form-actions">

                <a href="/" class="cancel-btn">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn">
                    Save Customer
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
